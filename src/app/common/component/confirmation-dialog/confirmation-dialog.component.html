<div class="modal-overlay">
  <div class="modal-content">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <div class="actions">
      <button class="btn btn-primary" (click)="cancel()">{{ cancelButtonText }}</button>
      <button class="btn btn-primary" (click)="confirm()">{{ confirmButtonText }}</button>
    </div>
  </div>
</div>
