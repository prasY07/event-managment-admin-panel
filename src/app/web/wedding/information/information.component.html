<div class="wedding-container">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3">Loading wedding information...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="hasError && !isLoading" class="alert alert-danger text-center py-5">
    <h4>Error</h4>
    <p>{{ errorMessage }}</p>
    <button (click)="goBack()" class="btn btn-primary">Go Back</button>
  </div>

  <!-- Wedding Information -->
  <div *ngIf="!isLoading && !hasError" class="wedding-content">

    <!-- Wedding Card with Image -->
    <div class="wedding-card">
      <!-- Wedding Image/Banner -->
      <div class="wedding-image-section" *ngIf="bannerImage">
        <img [src]="bannerImage" alt="Wedding Card" class="wedding-banner-img">
      </div>
      <div class="wedding-image-section" *ngIf="!bannerImage">
        <div class="placeholder-image">
          <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" viewBox="0 0 16 16">
            <path d="M3 0a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V3a3 3 0 0 0-3-3H3zm10 1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h10z"/>
            <path d="M6.002 3a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
            <path d="M9 6a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0z"/>
          </svg>
          <p>No Image Available</p>
        </div>
      </div>

      <!-- Wedding Details -->
      <div class="wedding-details">
        
        <!-- Registration Button -->
        <div class="text-center mt-5">
          <a [routerLink]="['/wedding', weddingId, 'registration']" class="btn btn-gold btn-lg">
            Register for Wedding
          </a>
        </div>

        <!-- Back Button -->
        <div class="text-center mt-3">
          <button (click)="goBack()" class="btn btn-outline-secondary">
            Go Back
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
