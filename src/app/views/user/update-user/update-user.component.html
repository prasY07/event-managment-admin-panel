
<c-row ngPreserveWhitespaces>
    <c-col xs="12">
      <c-card class="mb-4">
        <c-card-header>
          <strong>Update User</strong>
        </c-card-header>
        <c-card-body>
          <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="name">Name</label>
              <input
                id="name"
                class="form-control"
                placeholder="Enter Your Name"
                type="text"
                formControlName="name"
              />
              <div *ngIf="f['name'].touched && f['name'].invalid" class="text-danger">
                <small *ngIf="f['name'].errors?.['required']">Name is required.</small>
                <small *ngIf="f['name'].errors?.['minlength']">Minimum 3 characters.</small>
              </div>
            </div>
  
            <div class="mb-3">
              <label for="email">Email address</label>
              <input
                id="email"
                class="form-control"
                placeholder="name@example.com"
                type="email"
                formControlName="email"
              />
              <div *ngIf="f['email'].touched && f['email'].invalid" class="text-danger">
                <small *ngIf="f['email'].errors?.['required']">Email is required.</small>
                <small *ngIf="f['email'].errors?.['email']">Invalid email format.</small>
              </div>
            </div>
  
            <button type="submit" class="btn btn-primary">Submit</button>
          </form>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
