<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4">
      <c-card-header>
        <strong>Register for Event</strong>
      </c-card-header>
      <c-card-body>
        <form [formGroup]="eventUserRegisterForm" (ngSubmit)="onSubmit()">
          <div class="row">

            <!-- Name -->
            <div class="col-6 mb-3">
              <label>Name</label>
              <input class="form-control" formControlName="name" type="text" placeholder="Enter name" />
            </div>

            <!-- Phone Number -->
            <div class="col-6 mb-3">
              <label>Phone Number</label>
              <input class="form-control" formControlName="phone" type="text" placeholder="Enter phone number" />
            </div>

            <!-- Email -->
            <div class="col-6 mb-3">
              <label>Email</label>
              <input class="form-control" formControlName="email" type="email" placeholder="Enter email" />
            </div>

            <!-- State -->
            <div class="col-6 mb-3">
              <label>State</label>
              <input class="form-control" formControlName="state" type="text" placeholder="Enter state" />
            </div>

            <!-- Address -->
            <div class="col-12 mb-3">
              <label>Address</label>
              <input class="form-control" formControlName="address" type="text" placeholder="Enter address" />
            </div>

            <!-- Pincode -->
            <div class="col-6 mb-3">
              <label>Pincode</label>
              <input class="form-control" formControlName="pincode" type="text" placeholder="Enter pincode" />
            </div>

            <!-- About Event -->
            <div class="col-12 mb-3">
              <label>How did you hear about the event?</label><br />
              <div class="form-check form-check-inline" *ngFor="let socialSource of socialSources">
                <input
                  class="form-check-input"
                  type="radio"
                  [value]="socialSource.id"
                  formControlName="eventSource"
                />
                <label class="form-check-label">{{ socialSource.name | ucfirst }}</label>
              </div>
            </div>

            <!-- Gender -->
            <div class="col-12 mb-3">
              <label>Gender</label><br />
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" formControlName="gender" value="male" />
                <label class="form-check-label">Male</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" formControlName="gender" value="female" />
                <label class="form-check-label">Female</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" formControlName="gender" value="other" />
                <label class="form-check-label">Other</label>
              </div>
            </div>

            <!-- Member Type -->
            <div class="col-12 mb-3">
              <label>Member Type</label><br />
              <div class="form-check form-check-inline" *ngFor="let type of memberTypes">
                <input
                  class="form-check-input"
                  type="radio"
                  [value]="type.id"
                  formControlName="memberType"
                />
                <label class="form-check-label">{{ type.name | ucfirst }} ({{type.entryFees}})</label>
              </div>
            </div>
            

          </div>

          <button type="submit" class="btn btn-primary" [disabled]="eventUserRegisterForm.invalid">Submit</button>
        </form>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
