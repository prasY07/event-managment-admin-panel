<c-row ngPreserveWhitespaces>
    <c-col xs="12">
      <c-card class="mb-4">
        <c-card-header>
        <strong>Wedding Functions</strong>
        </c-card-header>
        <c-card-body>
        <div class="d-flex">
          <button  [routerLink]="['/admin/wedding/add-function', weddingId]" class="btn btn-primary ms-auto">Add Function</button>
        </div>

         <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" matSort>

          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef> # </th>
            <td mat-cell *matCellDef="let element; let i = index"> {{ i + 1 + page * pageSize }} </td>
          </ng-container>

          <!-- Function Name -->
          <ng-container matColumnDef="functionName">
            <th mat-header-cell *matHeaderCellDef> Function </th>
            <td mat-cell *matCellDef="let element"> {{element.functionName}} </td>
          </ng-container>

          <!-- Function Date -->
          <ng-container matColumnDef="functionDate">
            <th mat-header-cell *matHeaderCellDef> Date </th>
            <td mat-cell *matCellDef="let element"> {{element.functionDate | date}} </td>
          </ng-container>

          <!-- Start Time -->
          <ng-container matColumnDef="functionStartTime">
            <th mat-header-cell *matHeaderCellDef> Start Time </th>
            <td mat-cell *matCellDef="let element"> {{element.functionStartTime}} </td>
          </ng-container>

          <!-- End Time -->
          <ng-container matColumnDef="functionEndTime">
            <th mat-header-cell *matHeaderCellDef> End Time </th>
            <td mat-cell *matCellDef="let element"> {{element.functionEndTime}} </td>
          </ng-container>

          <!-- Venue Name -->
          <ng-container matColumnDef="venueName">
            <th mat-header-cell *matHeaderCellDef> Venue Name </th>
            <td mat-cell *matCellDef="let element"> {{element.venueName}} </td>
          </ng-container>

          <!-- Side Name -->
          <!-- <ng-container matColumnDef="functionAddress">
            <th mat-header-cell *matHeaderCellDef> Side </th>
            <td mat-cell *matCellDef="let element"> {{element.sideName}} </td>
          </ng-container> -->

       

          <!-- Action Column -->
          <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef> Action </th>

              <td mat-cell *matCellDef="let element"
                style="margin-top:10px; align-items: center;">
                <!-- Edit -->
                <!-- <a [routerLink]="['/admin/wedding/function', element.id, 'update']" 
                  [state]="{ weddingId: weddingId }" title="Edit">
                  <svg cIcon name="cil-pencil" size="lg"></svg>
                </a> -->

                <!-- View -->
                <a [routerLink]="['/admin/wedding/function', element.id]"
                  [state]="{ weddingId: weddingId }" title="View">
                  <svg cIcon name="cil-info" size="lg"></svg>
                </a>

                <!-- Notifications -->
                <a [routerLink]="['/admin/wedding/notification-list', weddingId, element.id]" title="Notifications">
                  <svg cIcon name="cil-bell" size="lg"></svg>
                </a>

                <!-- Delete -->
                <a (click)="deleteFunction(element.id)" title="Delete" style="cursor: pointer;">
                  <svg cIcon name="cil-trash" size="lg"></svg>
                </a>
              </td>
            </ng-container>


          <!-- Header and Row Declarations -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
          <mat-paginator [length]="totalItems" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons
          (page)="onPageChange($event)">
        </mat-paginator>
        </c-card-body>
      </c-card>
    </c-col>
  </c-row>
