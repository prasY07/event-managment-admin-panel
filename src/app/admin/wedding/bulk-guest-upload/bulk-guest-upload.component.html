<div class="modal fade" id="bulkGuestUploadModal" tabindex="-1" aria-labelledby="bulkGuestUploadModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="bulkGuestUploadModalLabel">Bulk Upload Guests</h5>
        <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="excelFile" class="form-label">Upload Excel File</label>
            <input 
              type="file" 
              id="excelFile" 
              class="form-control" 
              accept=".xlsx,.xls,.xlsm"
              (change)="onFileChange($event)"
              formControlName="file"
              [class.is-invalid]="uploadForm.get('file')?.invalid && uploadForm.get('file')?.touched">
            <div class="invalid-feedback" *ngIf="uploadForm.get('file')?.hasError('required')">
              Please select an Excel file.
            </div>
            <div class="invalid-feedback" *ngIf="uploadForm.get('file')?.hasError('invalidFileType')">
              Please select a valid Excel file (.xlsx, .xls, .xlsm).
            </div>
            <div class="form-text">
              <strong>Required fields in Excel:</strong> guestName, mobileNumber, sideName, countryCode
            </div>
            <div class="form-text mt-2" *ngIf="selectedFile">
              <strong>Selected file:</strong> {{ selectedFile.name }} ({{ (selectedFile.size / 1024).toFixed(2) }} KB)
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()" [disabled]="loading">Cancel</button>
        <button 
          type="button" 
          class="btn btn-primary" 
          (click)="onSubmit()" 
          [disabled]="loading || !uploadForm.valid">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          {{ loading ? 'Uploading...' : 'Upload' }}
        </button>
      </div>
    </div>
  </div>
</div>
