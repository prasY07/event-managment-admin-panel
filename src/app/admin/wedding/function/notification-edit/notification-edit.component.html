<c-row>
  <c-col xs="12" sm="12" md="8" class="mx-auto">
    <c-card class="mb-4">
      <c-card-header class="d-flex justify-content-between align-items-center">
        <strong>Edit Notification</strong>
      </c-card-header>
      <c-card-body>
        <div *ngIf="isLoading" class="text-center">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <form [formGroup]="notificationForm" (ngSubmit)="onSubmit()" class="form-horizontal" *ngIf="!isLoading">
          
          <div class="mb-3">
            <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
            <input 
              type="text" 
              class="form-control" 
              id="title"
              formControlName="title"
              placeholder="Enter notification title"
              [class.is-invalid]="notificationForm.get('title')?.invalid && notificationForm.get('title')?.touched"
            />
            <div class="invalid-feedback d-block" *ngIf="notificationForm.get('title')?.invalid && notificationForm.get('title')?.touched">
              <small *ngIf="notificationForm.get('title')?.errors?.['required']">Title is required</small>
              <small *ngIf="notificationForm.get('title')?.errors?.['minlength']">Title must be at least 2 characters</small>
              <small *ngIf="notificationForm.get('title')?.errors?.['maxlength']">Title cannot exceed 100 characters</small>
            </div>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message <span class="text-danger">*</span></label>
            <textarea 
              class="form-control" 
              id="message"
              formControlName="message"
              rows="4"
              placeholder="Enter notification message"
              [class.is-invalid]="notificationForm.get('message')?.invalid && notificationForm.get('message')?.touched"
            ></textarea>
            <div class="invalid-feedback d-block" *ngIf="notificationForm.get('message')?.invalid && notificationForm.get('message')?.touched">
              <small *ngIf="notificationForm.get('message')?.errors?.['required']">Message is required</small>
              <small *ngIf="notificationForm.get('message')?.errors?.['minlength']">Message must be at least 5 characters</small>
              <small *ngIf="notificationForm.get('message')?.errors?.['maxlength']">Message cannot exceed 500 characters</small>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="notificationDate" class="form-label">Date <span class="text-danger">*</span></label>
                <input 
                  type="date" 
                  class="form-control" 
                  id="notificationDate"
                  formControlName="notificationDate"
                  [class.is-invalid]="notificationForm.get('notificationDate')?.invalid && notificationForm.get('notificationDate')?.touched"
                />
                <div class="invalid-feedback d-block" *ngIf="notificationForm.get('notificationDate')?.invalid && notificationForm.get('notificationDate')?.touched">
                  <small *ngIf="notificationForm.get('notificationDate')?.errors?.['required']">Date is required</small>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="notificationTime" class="form-label">Time <span class="text-danger">*</span></label>
                <input 
                  type="time" 
                  class="form-control" 
                  id="notificationTime"
                  formControlName="notificationTime"
                  [class.is-invalid]="notificationForm.get('notificationTime')?.invalid && notificationForm.get('notificationTime')?.touched"
                />
                <div class="invalid-feedback d-block" *ngIf="notificationForm.get('notificationTime')?.invalid && notificationForm.get('notificationTime')?.touched">
                  <small *ngIf="notificationForm.get('notificationTime')?.errors?.['required']">Time is required</small>
                </div>
              </div>
            </div>
          </div>

          <div class="form-group row">
            <div class="col-md-12">
              <button 
                type="submit" 
                class="btn btn-primary me-2" 
                [disabled]="isSubmitting || notificationForm.invalid"
              >
                {{ isSubmitting ? 'Saving...' : 'Save' }}
              </button>
              <button 
                type="button" 
                class="btn btn-secondary" 
                (click)="onCancel()"
                [disabled]="isSubmitting"
              >
                Cancel
              </button>
            </div>
          </div>
        </form>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
