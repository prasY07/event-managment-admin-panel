<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4">
      <c-card-header>
        <strong>Add New User</strong>
      </c-card-header>
      <c-card-body>
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-6 mb-3">
              <label for="name">Name</label>
              <input id="name" class="form-control" placeholder="Enter Your Name" type="text" formControlName="name" />
              <div *ngIf="f['name'].touched && f['name'].invalid" class="text-danger">
                <small *ngIf="f['name'].errors?.['required']">Name is required.</small>
                <small *ngIf="f['name'].errors?.['minlength']">Minimum 3 characters.</small>
              </div>
            </div>

            <div class="col-6 mb-3">
              <label for="name">Phone Number</label>
              <input id="phoneNumber" class="form-control" placeholder="Enter Your Phone Number" type="text"
                formControlName="phoneNumber" />
              <div *ngIf="f['phoneNumber'].touched && f['phoneNumber'].invalid" class="text-danger">
                <small *ngIf="f['phoneNumber'].errors?.['required']">Phone Number is required.</small>
                <small *ngIf="f['phoneNumber'].errors?.['pattern']">
                Phone number must be 10 digits and start with digits between 6 and 9.
                </small>
              </div>
            </div>

            <div class="col-6 mb-3">
              <label for="email">Email address</label>
              <input id="email" class="form-control" placeholder="name@example.com" type="email"
                formControlName="email" />
              <div *ngIf="f['email'].touched && f['email'].invalid" class="text-danger">
                <small *ngIf="f['email'].errors?.['required']">Email is required.</small>
                <small *ngIf="f['email'].errors?.['email']">Invalid email format.</small>
              </div>
            </div>


            <div class="col-6 mb-3">
              <label for="role">Role</label>
              <select id="role" class="form-select" formControlName="role">
                <option value="">-- Select Role --</option>
                <option value="EVENT_MANAGER">Event Manager</option>
                <option value="INDIVIDUAL">Individual</option>
              </select>
              <div *ngIf="f['role'].touched && f['role'].invalid" class="text-danger">
              <small *ngIf="f['role'].errors?.['required']">Role is required.</small>
              </div>
            </div>

          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
